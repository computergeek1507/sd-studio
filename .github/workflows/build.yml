name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MSVC environment so Ninja can drive cl.exe
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build

      - name: Deploy Qt runtime
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build\sd_studio.exe dist\
          windeployqt --release --no-translations dist\sd_studio.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sd_studio-win64
          path: dist
